<!doctype html>
<!--
  OSINT — a single-file web client for a self-hosted SurfSense backend.

  This is ask.sh in a browser. Same contract, same isolation model: every user gets
  their own search space named "cli:<email>", which is the backend's real,
  server-enforced access boundary. Nothing is stored here but your preferences and
  the share tokens you minted; the session lives in an httpOnly cookie the backend
  sets, exactly like ask.sh's cookie jar.

  MUST be served from http://localhost:3000. The backend's CSRF middleware
  (app/auth/csrf.py) rejects any cookie-authenticated POST/PUT/DELETE whose Origin
  isn't allow-listed, and :3000 is the origin ask.sh sends by default. Opening this
  file with file:// sends Origin: null and every write fails with 403.

      python -m http.server 3000 --directory surfsense_backend/scripts/web

  See ../ask.sh and ../../docs/surfsense-backend-api-cookbook.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSINT</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --panel-2: #1c202b; --line: #272c39;
    --fg: #e6e8ee; --muted: #8b93a7; --accent: #4c8dff; --accent-fg: #fff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button {
    font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
  button.sm { padding: 2px 8px; font-size: 12px; }
  input, select, textarea {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---- auth ---- */
  #auth { margin: auto; width: 420px; max-width: 92vw; padding: 28px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #auth h1 { margin: 0 0 2px; font-size: 20px; }
  #auth .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #auth .row { display: flex; gap: 8px; margin-top: 18px; }
  #auth .row button { flex: 1; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 16px; }

  /* ---- app shell ---- */
  #app { display: none; flex: 1; min-height: 0; }
  #app.on { display: flex; }
  aside {
    width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .item {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--accent); color: var(--accent-fg); }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .act { opacity: 0; flex: none; }
  .item:hover .act { opacity: 1; }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 2px 8px; }
  .ro { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .7; }
  .item .dead { color: var(--warn); font-size: 11px; flex: none; }
  .stack { display: flex; gap: 6px; }
  .stack input { min-width: 0; }

  /* ---- chat ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 24px 0; }
  .msg { max-width: 760px; margin: 0 auto 22px; padding: 0 24px; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  .msg.user .bubble {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; white-space: pre-wrap;
  }
  .bubble { overflow-wrap: anywhere; }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; overflow-x: auto;
  }
  .bubble code:not(pre code) { background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .bubble a { color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; font-style: italic; }
  .status.err { color: var(--err); font-style: normal; }
  .status.warn { color: var(--warn); font-style: normal; }
  .cursor::after { content: "▍"; opacity: .6; }

  /* A client-side note (command output: report ready, /help, …). Not persisted;
     it re-derives from the server on demand (/reports), so a reload dropping it
     loses nothing. Dashed + muted to read as chrome, not as the model speaking. */
  .msg.system .bubble.sys {
    background: var(--panel); border: 1px dashed var(--line); color: var(--muted);
    border-radius: var(--radius); padding: 9px 13px; white-space: pre-wrap; font-size: 13px;
  }
  .msg.system .bubble.sys a { color: var(--accent); cursor: pointer; }

  footer { border-top: 1px solid var(--line); padding: 14px 24px 16px; background: var(--panel); }
  .composer { max-width: 760px; margin: 0 auto; }
  .composer .box { display: flex; gap: 8px; align-items: flex-end; }
  #q { resize: none; max-height: 180px; }
  .opts {
    max-width: 760px; margin: 8px auto 0; display: flex; gap: 16px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .opts label { display: flex; gap: 6px; align-items: center; margin: 0; cursor: pointer; }
  .opts input[type=checkbox] { width: auto; }

  /* ---- progress + toast ---- */
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 10px 14px; max-width: 420px; font-size: 13px; white-space: pre-wrap;
  }
  .toast.err { border-left-color: var(--err); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.ok { border-left-color: var(--ok); }
  .token { word-break: break-all; font-size: 11px; background: var(--bg); border: 1px solid var(--line);
           border-radius: 4px; padding: 6px; margin: 6px 0; }
  .hide { display: none !important; }

  /* ---- citations ---- */
  a.cite {
    display: inline-block; min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    color: var(--accent); font-size: 10px; line-height: 15px; text-align: center;
    text-decoration: none; vertical-align: super; cursor: pointer;
  }
  a.cite:hover, a.cite.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  #cite {
    width: 380px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    display: none; flex-direction: column; overflow: hidden;
  }
  #cite.on { display: flex; }
  #cite header {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  #cite header .t { flex: 1; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  #cite .body { overflow-y: auto; padding: 12px 14px; }
  #cite .chunk { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin-bottom: 14px; overflow-wrap: anywhere; }
  #cite .chunk.hit {
    color: var(--fg); background: var(--panel-2); border-left: 2px solid var(--accent);
    border-radius: 0 6px 6px 0; padding: 8px 12px;
  }

  /* ---- admin overlay ---- */
  #adminBtn { margin-top: 8px; width: 100%; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 900px; max-width: 96vw; max-height: 90vh; display: flex; flex-direction: column;
  }
  .overlay header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .overlay header .t { flex: 1; font-size: 15px; font-weight: 600; }
  .overlay .body { overflow-y: auto; padding: 8px 16px 16px; }
  .overlay .body h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin: 18px 0 8px;
  }
  .arow {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
    border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap;
  }
  .arow .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
  .arow .sub { color: var(--muted); font-size: 12px; }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px;
    border-radius: 4px; border: 1px solid var(--line); color: var(--muted);
  }
  .badge.admin { color: var(--accent); border-color: var(--accent); }
  .badge.off  { color: var(--warn); border-color: var(--warn); }
  .badge.dead { color: var(--err); border-color: var(--err); }
  .afolders { width: 100%; padding: 4px 0 4px 16px; }
</style>
</head>
<body>

<!-- ============================ auth ============================ -->
<div id="auth">
  <h1>OSINT</h1>
  <div class="sub">A private knowledge base you can ask questions.</div>
  <div id="originWarn" class="toast err hide" style="max-width:none;margin-bottom:12px"></div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="min. 8 characters">

  <div id="apiKeyRow">
    <label for="apiKey">Model API key <span title="Wires the chat model to your user. Stored server-side on a model connection scoped to your search space.">ⓘ</span></label>
    <input id="apiKey" type="password" placeholder="sk-...">
  </div>

  <details class="adv">
    <summary>Advanced</summary>
    <label for="backend">Backend URL</label>
    <input id="backend" placeholder="http://localhost:8000">
    <label for="model">Model</label>
    <input id="model" placeholder="deepseek-chat">
    <label for="modelBase">Model base URL</label>
    <input id="modelBase" placeholder="https://api.deepseek.com/v1">
  </details>

  <div class="row">
    <button id="loginBtn" class="primary">Sign in</button>
    <button id="registerBtn">Register</button>
  </div>
  <div id="authMsg" class="note"></div>
</div>

<!-- ============================ app ============================ -->
<div id="app">
  <aside>
    <section>
      <h2>Session</h2>
      <div id="sessions"></div>
      <div class="stack" style="margin-top:8px">
        <input id="newSession" placeholder="new session (name optional)…">
        <button id="newSessionBtn" class="sm">Start</button>
      </div>
    </section>

    <section>
      <h2>
        Folders
        <button id="addFolderBtn" class="sm">+ Add</button>
      </h2>
      <input id="folderPicker" type="file" webkitdirectory directory multiple class="hide">
      <div class="opts" style="max-width:none;margin:6px 0 0">
        <label>
          <input type="checkbox" id="sessionScoped">
          This session only
          <span title="Off (the default): the folder is space-wide — every session retrieves it. On: only the session open at upload time sees it, until ⤴ promotes it.">ⓘ</span>
        </label>
      </div>
      <div id="folders"></div>
      <div id="ingest" class="hide">
        <div class="note" id="ingestMsg"></div>
        <div class="bar"><div id="ingestBar"></div></div>
      </div>
    </section>

    <section>
      <h2>
        Report templates
        <button id="addTplBtn" class="sm">+ Add</button>
      </h2>
      <input id="tplPicker" type="file" accept=".docx,.pdf,.md,.markdown,.txt" multiple class="hide">
      <div id="templates"></div>
    </section>

    <section>
      <h2>Imported <span class="ro">read-only</span></h2>
      <div id="imports"></div>
      <div class="stack" style="margin-top:8px">
        <input id="importToken" placeholder="paste a share token…">
        <button id="importBtn" class="sm">Import</button>
      </div>
    </section>

    <section>
      <h2>Shared by you</h2>
      <div id="shares"></div>
    </section>

    <section style="margin-top:auto; border-bottom:none">
      <div class="note mono" id="whoami"></div>
      <button id="adminBtn" class="sm hide">Admin</button>
      <button id="signOut" class="sm" style="margin-top:8px; width:100%">Sign out</button>
    </section>
  </aside>

  <main>
    <div id="msgs"></div>
    <footer>
      <div class="composer">
        <div class="box">
          <textarea id="q" rows="1" placeholder="Ask your knowledge base…  (/help for commands · Enter to send, Shift+Enter for a newline)"></textarea>
          <button id="send" class="primary">Send</button>
        </div>
        <div class="opts">
          <label>
            <input type="checkbox" id="simpleRag" checked>
            Retrieve then answer
            <span title="On: the server searches the knowledge base itself and the model answers from those passages in one tool-free call — grounded even on small local models. Off: the full agent decides for itself whether to retrieve, and can also use web search, connectors and memory.">ⓘ</span>
          </label>
          <span id="ctx" class="mono"></span>
        </div>
      </div>
    </footer>
  </main>

  <aside id="cite">
    <header>
      <span class="t" id="citeTitle"></span>
      <button id="citeClose" class="sm">✕</button>
    </header>
    <div class="body" id="citeBody"></div>
  </aside>
</div>

<!-- ===================== admin (superusers only) ===================== -->
<div id="admin" class="overlay hide">
  <div class="panel">
    <header>
      <span class="t">System admin</span>
      <button id="adminRefresh" class="sm">Refresh</button>
      <button id="adminClose" class="sm">✕</button>
    </header>
    <div class="body">
      <h3>Users</h3>
      <div id="adminUsers"></div>
      <h3>Folder shares — hard-revoke removes the folder from every importer</h3>
      <div id="adminShares"></div>
      <h3>Imported links</h3>
      <div id="adminLinks"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ utils */

const $ = (sel) => document.querySelector(sel);
const LS = "surfsense.mini";

// serve.py rewrites the marker below into assignments: --deepseek <key> injects
// apiKey; --vllm <model> --vllm_port <port> injects apiKey ("EMPTY"), model and
// modelBase. Under a plain static server it stays a comment, and the login
// screen asks for the key. Injected values are deliberately NOT written to
// localStorage: they live only in the page that served them.
window.SS_CONFIG = window.SS_CONFIG || {};
/*__SS_CONFIG__*/
const INJECTED_KEY = window.SS_CONFIG.apiKey || "";
const INJECTED_MODEL = window.SS_CONFIG.model || "";
const INJECTED_BASE = window.SS_CONFIG.modelBase || "";

const state = {
  backend: "http://localhost:8000",
  email: "", password: "", apiKey: "",
  model: "deepseek-chat", modelBase: "https://api.deepseek.com/v1",
  simpleRag: true,
  spaceId: null, threadId: null, threadTitle: "",
  lastReportId: null,   // most recent report in this thread; the default for /export and /revise
  isAdmin: false,       // is_superuser — gates the Admin panel (server also enforces it)
  relogged: false, busy: false,
  shares: [],       // [{path, token}] — the backend has no list endpoint, so we remember
  templates: [],    // [{id, name, outline, content}] — report format exemplars, browser-only
};

const readPrefs = () => {
  try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; }
};

/**
 * Preferences are shared by everyone using this browser, but per-user state must
 * not be: a share token is a capability — anyone holding it can import that folder
 * — and a thread id belongs to one user's search space. Keeping either at the top
 * level handed the previous user's shares and session to whoever signed in next.
 * So they live under byUser[email], and signing in adopts only that user's slice.
 */
function savePrefs() {
  const prefs = readPrefs();
  const byUser = prefs.byUser ?? {};
  if (state.email) {
    byUser[state.email] = {
      shares: state.shares,
      threadId: state.threadId,
      threadTitle: state.threadTitle,
      templates: state.templates,
    };
  }
  localStorage.setItem(LS, JSON.stringify({
    backend: state.backend, email: state.email,
    apiKey: INJECTED_KEY ? "" : state.apiKey,
    model: INJECTED_MODEL ? "" : state.model,
    modelBase: INJECTED_BASE ? "" : state.modelBase,
    simpleRag: state.simpleRag,
    byUser,
  }));
}

/** Load the shared prefs, then whatever belongs to `email` (nothing, if new). */
function adoptUser(email) {
  const mine = readPrefs().byUser?.[email] ?? {};
  state.shares = mine.shares ?? [];
  state.threadId = mine.threadId ?? null;
  state.threadTitle = mine.threadTitle ?? "";
  state.templates = mine.templates ?? [];
}

function loadPrefs() {
  const prefs = readPrefs();
  const { byUser, shares, threadId, threadTitle, ...shared } = prefs;
  Object.assign(state, shared);

  // Migrate the pre-byUser layout, where these sat at the top level and leaked
  // across accounts. Attribute them to the user who was last signed in.
  if (!byUser && prefs.email && (shares || threadId)) {
    state.shares = shares ?? [];
    state.threadId = threadId ?? null;
    state.threadTitle = threadTitle ?? "";
    savePrefs();
  }

  adoptUser(state.email);
  // Served values always win; empty leftovers fall back to the DeepSeek defaults.
  if (INJECTED_KEY) state.apiKey = INJECTED_KEY;
  state.model = INJECTED_MODEL || state.model || "deepseek-chat";
  state.modelBase = INJECTED_BASE || state.modelBase || "https://api.deepseek.com/v1";
}

function toast(msg, kind = "ok", ms = 6000) {
  const t = document.createElement("div");
  t.className = `toast ${kind}`;
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), ms);
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* --------------------------------------------------------------- transport */

/** The backend speaks {"detail": ...} on errors; fall back to the raw body. */
async function errorDetail(res) {
  const body = await res.text();
  try {
    const j = JSON.parse(body);
    return typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail ?? j);
  } catch { return body || `HTTP ${res.status}`; }
}

class ApiError extends Error {
  constructor(status, detail) { super(detail); this.status = status; this.detail = detail; }
}

/**
 * Every request carries the session cookie (credentials: "include"). The browser
 * sets Origin for us, which is what the backend's CSRF check reads — hence the
 * hard requirement to serve this page from an allow-listed origin (:3000).
 *
 * Re-logs-in once on 401/403, mirroring ask.sh's api(): the session cookie is
 * short-lived (~1h) and expiring mid-session shouldn't be a visible failure.
 */
async function api(method, path, opts = {}) {
  const send = () => fetch(state.backend + path, {
    method,
    credentials: "include",
    headers: opts.json ? { "Content-Type": "application/json" } : undefined,
    body: opts.json ? JSON.stringify(opts.json) : opts.body,
    signal: opts.signal,
  });

  let res;
  try { res = await send(); }
  catch { throw new ApiError(0, `cannot reach ${state.backend} — is the backend up?`); }

  if ((res.status === 401 || res.status === 403) && !state.relogged && state.password) {
    state.relogged = true;
    await login(state.email, state.password);
    state.relogged = false;
    try { res = await send(); }
    catch { throw new ApiError(0, `cannot reach ${state.backend}`); }
  }
  if (!res.ok) throw new ApiError(res.status, await errorDetail(res));
  return res;
}

const apiJson = async (method, path, opts) => {
  const res = await api(method, path, opts);
  return res.status === 204 ? null : res.json();
};

async function login(email, password) {
  const res = await fetch(state.backend + "/auth/jwt/login", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ username: email, password }),
  }).catch(() => { throw new ApiError(0, `cannot reach ${state.backend}`); });

  if (res.status === 400) throw new ApiError(400, "Bad credentials. Register first, or check the password.");
  if (!res.ok) throw new ApiError(res.status, await errorDetail(res));
}

async function register(email, password) {
  const res = await fetch(state.backend + "/auth/register", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  }).catch(() => { throw new ApiError(0, `cannot reach ${state.backend}`); });

  if (res.ok) return "registered";
  const detail = await errorDetail(res);
  if (res.status === 400 && detail.includes("REGISTER_USER_ALREADY_EXISTS")) return "exists";
  if (res.status === 403) throw new ApiError(403, "Registration is disabled on this backend (AUTH_TYPE=GOOGLE, or REGISTRATION_ENABLED off).");
  if (res.status === 422) throw new ApiError(422, "Invalid email, or password too short (min. 8 characters).");
  if (res.status === 429) throw new ApiError(429, "Rate limited by the backend. Wait, then retry.");
  throw new ApiError(res.status, detail);
}

/* -------------------------------------------------------------- bootstrap */

/**
 * One space per user, named cli:<email> — the same space ask.sh uses, so the two
 * clients see one knowledge base. A search space is the server-enforced access
 * boundary; we never let the user name one by id.
 */
async function ensureSpace() {
  const want = `cli:${state.email}`;
  const spaces = await apiJson("GET", "/api/v1/searchspaces?limit=200&skip=0&owned_only=true");
  const found = (spaces || []).find((s) => s.name === want);
  if (found) { state.spaceId = found.id; return; }

  const made = await apiJson("POST", "/api/v1/searchspaces", {
    json: { name: want, description: "Private CLI knowledge base" },
  });
  state.spaceId = made.id;
  toast(`Created your private search space #${made.id}`);
}

/**
 * Create-or-update the model connection, then point the space's *chat role* at
 * the model row it produced. Both halves are required: a connection alone leaves
 * the chat role unset and every question fails. provider=openai + an explicit
 * base_url keeps the key strictly per-connection.
 */
async function ensureModel() {
  const conns = await apiJson("GET", `/api/v1/model-connections?search_space_id=${state.spaceId}`);
  const conn = (conns || []).find((c) => c.base_url === state.modelBase && c.search_space_id != null);

  let modelRowId = null;
  if (conn) {
    await api("PUT", `/api/v1/model-connections/${conn.id}`, {
      json: { api_key: state.apiKey, enabled: true },
    });
    modelRowId = (conn.models || []).find((m) => m.model_id === state.model)?.id ?? null;
  }

  if (!modelRowId) {
    // The connection exists but carries no row for this model id — rebuild it clean.
    if (conn) await api("DELETE", `/api/v1/model-connections/${conn.id}`);
    const made = await apiJson("POST", "/api/v1/model-connections", {
      json: {
        provider: "openai", base_url: state.modelBase, api_key: state.apiKey,
        scope: "SEARCH_SPACE", search_space_id: state.spaceId, enabled: true,
        models: [{
          model_id: state.model, display_name: state.model, source: "MANUAL",
          supports_chat: true, supports_tools: true, enabled: true,
        }],
      },
    });
    modelRowId = (made.models || []).find((m) => m.model_id === state.model)?.id ?? null;
    if (!modelRowId) throw new ApiError(0, `connection created, but it has no model row for "${state.model}"`);
  }

  const roles = await apiJson("GET", `/api/v1/search-spaces/${state.spaceId}/model-roles`);
  if (roles?.chat_model_id !== modelRowId) {
    await api("PUT", `/api/v1/search-spaces/${state.spaceId}/model-roles`, {
      json: { chat_model_id: modelRowId },
    });
  }
}

/* ---------------------------------------------------------------- threads */

const listThreads = async () => {
  const r = await apiJson("GET", `/api/v1/threads?search_space_id=${state.spaceId}`);
  return r?.threads ?? r?.items ?? (Array.isArray(r) ? r : []);
};

/**
 * Open a thread by id.
 *
 * A session is a thread *id*, never a title. Titles are not stable: the backend
 * auto-generates one from the first exchange (title_gen.py) and overwrites
 * whatever we set. Looking a session up by title therefore misses the renamed
 * thread and silently forks a new empty one, stranding the conversation under a
 * name the user never chose. keepTitle() puts our name back, but the id is what
 * we navigate by.
 */
async function openThread(thread) {
  state.threadId = thread.id;
  state.threadTitle = thread.title;
  state.lastReportId = null;   // the /export|/revise default is per-thread; don't carry it across
  savePrefs();
  // renderFolders too: the "this session" badges depend on which thread is open.
  await Promise.all([renderSessions(), loadHistory(), renderFolders()]);
  renderContext();
}

/**
 * The name is optional. An unnamed session is opened with an empty threadTitle
 * so keepTitle() stays out of the way and the backend's auto-titler names it
 * from the first exchange — passing the server's "New Chat" placeholder through
 * would pin the session to that placeholder forever.
 */
async function createSession(title) {
  const json = { search_space_id: state.spaceId };
  if (title) json.title = title;
  const thread = await apiJson("POST", "/api/v1/threads", { json });
  await openThread(title ? thread : { ...thread, title: "" });
}

/** Resume the last thread we were in; fall back to the newest, else start one. */
async function resumeSession() {
  const threads = await listThreads();
  const mine = threads.find((t) => t.id === state.threadId) ?? threads[0];
  if (mine) await openThread(mine);
  else await createSession("");
}

/**
 * Assistant-ui stores message content as JSONB: a plain string on some rows, an
 * array of typed parts on others. Take the text and ignore the rest.
 */
function messageText(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) {
    return content.filter((p) => p?.type === "text" && typeof p.text === "string")
                  .map((p) => p.text).join("");
  }
  if (content && typeof content.text === "string") return content.text;
  return "";
}

/**
 * The answer inside a stored assistant message, on the same rule the live stream
 * uses: the backend starts a fresh text part after every tool call
 * (tasks/chat/content_builder.py), so the last non-empty text part is the answer.
 * Everything before it is the model narrating its way there ("Let me search the
 * knowledge base…") and is dropped.
 */
function assistantAnswer(content) {
  const blocks = Array.isArray(content)
    ? content.filter((p) => p?.type === "text" && typeof p.text === "string")
             .map((p) => p.text).filter((t) => t.trim())
    : [messageText(content)].filter((t) => t.trim());

  return blocks.pop() ?? "";
}

/**
 * Questions go to the backend wrapped in a directive (force-retrieval for a normal
 * ask, generate_report for /report); show only what the user typed. Match either
 * wrapper so reloaded history stays clean instead of showing the raw directive.
 */
const unwrapQuestion = (text) =>
  text.match(/<question>\n([\s\S]*?)\n<\/question>/)?.[1]
  ?? text.match(/<report_request>\n([\s\S]*?)\n<\/report_request>/)?.[1]
  ?? text;

async function loadHistory() {
  closeCitation();
  $("#msgs").replaceChildren();
  const history = await apiJson("GET", `/api/v1/threads/${state.threadId}`);
  for (const m of history?.messages ?? []) {
    if (m.role === "user") {
      const text = messageText(m.content);
      if (text.trim()) addMessage("user", unwrapQuestion(text));
    } else if (m.role === "assistant") {
      const answer = assistantAnswer(m.content);
      if (answer.trim()) addMessage("assistant", answer);
    }
  }
  scrollDown();
}

/* ---------------------------------------------------------------- folders */

const watchedFolders = () =>
  apiJson("GET", `/api/v1/documents/watched-folders?search_space_id=${state.spaceId}`);

/** folder_id filtering is exact, not recursive — walk the tree ourselves. */
async function subtreeIds(rootId) {
  const all = await apiJson("GET", `/api/v1/folders?search_space_id=${state.spaceId}`) ?? [];
  const ids = new Set([rootId]);
  for (let grew = true; grew; ) {
    grew = false;
    for (const f of all) {
      if (f.parent_id != null && ids.has(f.parent_id) && !ids.has(f.id)) { ids.add(f.id); grew = true; }
    }
  }
  return ids;
}

async function docsIn(ids) {
  const page = await apiJson("GET",
    `/api/v1/documents?search_space_id=${state.spaceId}&document_types=LOCAL_FOLDER_FILE&page_size=-1`);
  return (page?.items ?? []).filter((d) => d.folder_id != null && ids.has(d.folder_id));
}

const MAX_FILE_BYTES = 500 * 1024 * 1024;
const BATCH = 20;
const POLL_MS = 3000, TIMEOUT_MS = 1_800_000, STABLE_POLLS = 2;

// How long to wait for the FIRST document row before concluding nobody is making
// them. Generous: it only has to cover the worker picking the job off the queue.
const NO_DOCS_GRACE_MS = 60_000;

const WORKER_HINT =
  "/documents/folder-upload only queues a Celery task — the worker is what creates " +
  "the documents, so an upload can succeed while nothing is ever indexed.\n\n" +
  "Start it in surfsense_backend/:\n\n" +
  "  uv run celery -A celery_worker.celery_app worker --loglevel=info \\\n" +
  "    --concurrency=1 --pool=solo --queues=surfsense,surfsense.connectors";

/**
 * Blocks until every document under `rootId` has settled. A folder can't answer
 * anything until it is fully indexed, and Celery keeps inserting rows after the
 * upload returns — so "nothing is processing" only counts once the numbers hold
 * still for STABLE_POLLS consecutive reads.
 */
async function waitReady(rootId, expected, onProgress) {
  let waited = 0, stable = 0, last = "";
  while (waited < TIMEOUT_MS) {
    const docs = await docsIn(await subtreeIds(rootId));
    const ready = docs.filter((d) => d.status?.state === "ready").length;
    const failed = docs.filter((d) => d.status?.state === "failed").length;
    const busy = docs.filter((d) => ["processing", "deleting"].includes(d.status?.state)).length;

    onProgress(ready, expected, busy, failed, docs.length);

    // No rows at all, well past the time the worker needed to claim the job: it
    // isn't running. Say so instead of polling in silence until TIMEOUT_MS.
    if (docs.length === 0 && waited >= NO_DOCS_GRACE_MS) {
      throw new ApiError(0,
        `The upload was accepted, but ${Math.round(waited / 1000)}s later not one ` +
        `document exists for this folder.\n\n${WORKER_HINT}`);
    }

    if (docs.length > 0 && busy === 0) {
      const snap = `${docs.length}:${ready}:${failed}`;
      if (snap === last) { if (++stable >= STABLE_POLLS) return { ready, failed }; }
      else stable = 0;
      last = snap;
    } else {
      last = `${docs.length}:${ready}:${failed}`;
    }
    await sleep(POLL_MS);
    waited += POLL_MS;
  }
  throw new ApiError(0, `Timed out after ${TIMEOUT_MS / 1000}s with indexing unfinished.\n\n${WORKER_HINT}`);
}

/**
 * The browser hands us a folder as a flat FileList whose webkitRelativePath is
 * "<root>/<sub>/<file>". The first segment is the folder name — everything after
 * it is the relative path the backend wants. Skip dotfiles and oversized files,
 * matching ask.sh's collect_files.
 */
function collectFiles(fileList) {
  const files = [], paths = [];
  let root = "";
  for (const f of fileList) {
    const segs = (f.webkitRelativePath || f.name).split("/");
    if (!root) root = segs[0];
    if (segs.some((s) => s.startsWith("."))) continue;
    if (f.size > MAX_FILE_BYTES) continue;
    files.push(f);
    paths.push(segs.slice(1).join("/"));
  }
  return { root, files, paths };
}

/**
 * Hand the picked folder to ingest().
 *
 * `input.files` is a LIVE FileList bound to the input, not a snapshot. We clear the
 * input so that re-picking the same folder fires `change` again — and that clearing
 * empties the FileList we are holding. So copy the entries out FIRST: reading it
 * afterwards yields zero files, and the upload silently never happens.
 */
function onFolderPicked(input) {
  const files = Array.from(input.files);
  input.value = "";
  if (files.length) guard(() => ingest(files));
  return files;
}

async function ingest(fileList) {
  const { root, files, paths } = collectFiles(fileList);
  if (!files.length) { toast("No indexable files in that folder.", "warn"); return; }

  // Uploads are space-wide unless "this session only" is ticked: the backend
  // scopes a folder to whichever thread_id we send (invisible to every other
  // session until ⤴ promotes it), and we always have a session open —
  // resumeSession() opens or creates one at boot — so sending it unconditionally
  // would strand every upload in the session that happened to be open.
  const threadId = $("#sessionScoped").checked ? (state.threadId ?? null) : null;

  // The KB label is the basename, never a full disk path: it becomes Folder.name,
  // which the agent sees as /documents/<name>/… — a full path would leak the
  // machine's directory layout into every prompt. The duplicate check matches
  // scope too: another session's "root" is a different folder, not a rebuild.
  const existing = (await watchedFolders() ?? []).find(
    (f) => f.name === root && (f.owner_thread_id ?? null) === threadId);
  if (existing && !confirm(`"${root}" is already indexed${threadId ? " in this session" : ""}. Rebuild it? Its documents will be deleted and re-extracted.`)) return;

  const panel = $("#ingest"), bar = $("#ingestBar"), msg = $("#ingestMsg");
  panel.classList.remove("hide");
  const progress = (text, frac) => { msg.textContent = text; bar.style.width = `${Math.round(frac * 100)}%`; };

  try {
    if (existing) { progress(`removing old "${root}"…`, 0); await deleteFolder(existing.id); }

    let rootId = null;
    for (let i = 0; i < files.length; i += BATCH) {
      const chunk = files.slice(i, i + BATCH);
      const fd = new FormData();
      fd.append("folder_name", root);
      fd.append("search_space_id", String(state.spaceId));
      fd.append("relative_paths", JSON.stringify(paths.slice(i, i + BATCH)));
      if (threadId) fd.append("thread_id", String(threadId));
      if (rootId) fd.append("root_folder_id", String(rootId));
      for (const f of chunk) fd.append("files", f, f.name);

      const res = await apiJson("POST", "/api/v1/documents/folder-upload", { body: fd });
      rootId ??= res?.root_folder_id;
      if (!rootId) throw new ApiError(0, "folder-upload returned no root_folder_id");
      progress(`uploading ${Math.min(i + BATCH, files.length)}/${files.length}…`, (i + chunk.length) / files.length * 0.5);
    }

    // Drop documents for files that are no longer on disk.
    await api("POST", "/api/v1/documents/folder-sync-finalize", {
      json: {
        folder_name: root, search_space_id: state.spaceId,
        root_folder_id: rootId, all_relative_paths: paths,
      },
    });

    const { ready, failed } = await waitReady(rootId, files.length, (r, exp, busy, bad, total) =>
      progress(
        total === 0
          ? "queued — waiting for the indexer to pick it up…"
          : `indexing ${r}/${exp} · ${busy} processing · ${bad} failed`,
        0.5 + (r / exp) * 0.5));

    if (ready < files.length) {
      const missing = files.length - ready - failed;
      toast(`Indexed ${ready}/${files.length} in "${root}". ${failed} failed; ` +
            `${missing} produced no document (unsupported type, or identical content already indexed).`, "warn", 12000);
    } else {
      toast(`Indexed ${ready} file(s) into "${root}"` +
            (threadId ? " (visible only in this session — ⤴ in Folders makes it space-wide)." : "."), "ok", 9000);
    }
  } catch (e) {
    toast(`Ingest of "${root}" failed: ${e.message}`, "err", 12000);
  } finally {
    panel.classList.add("hide");
    bar.style.width = "0";
    await renderFolders();
  }
}

async function deleteFolder(id) {
  await api("DELETE", `/api/v1/folders/${id}`);
  for (let waited = 0; waited < TIMEOUT_MS; waited += POLL_MS) {
    const all = await apiJson("GET", `/api/v1/folders?search_space_id=${state.spaceId}`) ?? [];
    if (!all.some((f) => f.id === id)) return;
    await sleep(POLL_MS);
  }
  throw new ApiError(0, `folder #${id} is still present after ${TIMEOUT_MS / 1000}s`);
}

/* ----------------------------------------------------------------- shares */

async function shareFolder(path) {
  const { token } = await apiJson("POST", `/api/v1/search-spaces/${state.spaceId}/folder-shares`, {
    json: { path },
  });
  state.shares.push({ path, token });
  savePrefs();
  renderShares();
  toast(`Share token for "${path}" created. Hand it to the other user — they paste it under Shares → Import.`, "ok", 10000);
}

async function unshareFolder(token) {
  await api("DELETE", `/api/v1/folder-shares/${token}`);
  state.shares = state.shares.filter((s) => s.token !== token);
  savePrefs();
  renderShares();
  toast("Revoked. Importers lose access on their next query.", "ok");
}

/**
 * An imported folder lives in the *sharer's* search space — we only hold a link to
 * it. So it appears in neither /folders nor /documents/watched-folders, which is
 * why it belongs in its own list rather than under Folders (whose Share and Delete
 * act on folders you own, and neither is yours to do here) or under Shares (tokens
 * you minted for other people).
 */
const listImports = () =>
  apiJson("GET", `/api/v1/search-spaces/${state.spaceId}/folder-links`);

async function importFolder(token) {
  const { folder_name } = await apiJson("POST", `/api/v1/search-spaces/${state.spaceId}/folder-links`, {
    json: { token },
  });
  toast(`Imported "${folder_name}" — it is searchable now, and readable (read-only) at /documents/_shared/${folder_name}.`, "ok", 10000);
  await renderImports();
}

/** Drops our link. The sharer's folder and documents are untouched. */
async function removeImport(link) {
  await api("DELETE", `/api/v1/folder-links/${link.id}`);
  toast(`Removed "${link.folder_name}" — it is no longer searchable here. The owner's copy is untouched.`);
  await renderImports();
}

/* -------------------------------------------------------------- templates */
//
// Report templates are exemplar reports the user uploads; /report t<id> makes
// generate_report follow their structure and style. They are per-user browser
// state (like shares): the backend has no template storage, and the format
// reaches the model inside the /report directive.
//
// .docx is the preferred format — real Vietnamese reports live in Word — and
// the browser can't read it, so those (and .pdf) are converted server-side by
// POST /documents/extract-markdown, which runs the backend's ETL service
// (docling). .md/.txt are accepted too and read locally.

const TPL_TEXT_EXT = /\.(md|markdown|txt)$/i;   // readable in the browser
const TPL_CONVERT_EXT = /\.(docx|pdf)$/i;       // server-converted via docling
const TPL_NAME_EXT = /\.(docx|pdf|md|markdown|txt)$/i;

const TPL_MAX_BYTES = 20 * 1024 * 1024;  // matches the backend conversion cap
const TPL_STORE_CHARS = 20000;      // how much of the template body we keep
const TPL_PROMPT_CHARS = 4000;      // style excerpt embedded in the directive
const TPL_MAX_SECTIONS = 40;

/**
 * Pull the section skeleton out of a template. Vietnamese reports rarely use
 * Markdown headings, so beyond `#` we accept the forms they actually use:
 * "PHẦN I:", "Chương 2.", "I.", "1.2)", and short ALL-CAPS lines (checked with
 * the vi locale so "MỞ ĐẦU" counts). Fewer than 2 hits means the file has no
 * recognizable structure and is rejected as a template.
 */
function extractOutline(text) {
  const outline = [];
  let inFence = false;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (line.startsWith("```")) { inFence = !inFence; continue; }
    if (inFence || !line || line.length > 120) continue;

    const isMd = /^#{1,6}\s+\S/.test(line);
    const isNumbered =
      /^(?:PHẦN|CHƯƠNG|MỤC|Phần|Chương|Mục)?\s*(?:[IVXLC]{1,7}|\d+(?:\.\d+){0,3})\s*[.):–-]\s+\S/.test(line);
    const letters = (line.match(/\p{L}/gu) || []).length;
    const isCaps = letters >= 3 && line.length <= 80 &&
      line === line.toLocaleUpperCase("vi") && line !== line.toLocaleLowerCase("vi");

    if (isMd || isNumbered || isCaps) outline.push(line);
    if (outline.length >= TPL_MAX_SECTIONS) break;
  }
  return outline;
}

/** The template's text: read locally when the browser can, else convert server-side. */
async function templateText(f) {
  if (TPL_TEXT_EXT.test(f.name)) return (await f.text()).trim();
  toast(`Converting "${f.name}" on the server…`, "ok", 5000);
  const fd = new FormData();
  fd.append("file", f, f.name);
  const res = await apiJson("POST", "/api/v1/documents/extract-markdown", { body: fd });
  return (res?.markdown ?? "").trim();
}

async function addTemplates(files) {
  for (const f of files) {
    if (!TPL_CONVERT_EXT.test(f.name) && !TPL_TEXT_EXT.test(f.name)) {
      toast(`"${f.name}": upload the report as .docx (preferred) — .pdf, .md and .txt also work.`, "warn", 10000);
      continue;
    }
    if (f.size > TPL_MAX_BYTES) {
      toast(`"${f.name}" is over ${Math.round(TPL_MAX_BYTES / (1024 * 1024))}MB — too large for a template.`, "warn");
      continue;
    }

    let text;
    try { text = await templateText(f); }
    catch (e) {
      toast(`Could not convert "${f.name}": ${e.message}`, "err", 12000);
      continue;
    }

    const outline = extractOutline(text);
    if (outline.length < 2) {
      toast(`"${f.name}" doesn't look like a valid report format: no section headings found. ` +
            `A template needs headings such as "# Tiêu đề", "PHẦN I:", "1. Mở đầu", or ALL-CAPS lines.`, "warn", 12000);
      continue;
    }
    const id = state.templates.reduce((m, t) => Math.max(m, t.id), 0) + 1;
    state.templates.push({
      id,
      name: f.name.replace(TPL_NAME_EXT, ""),
      outline,
      content: text.slice(0, TPL_STORE_CHARS),
    });
    toast(`Template t${id} — "${f.name}" added (${outline.length} sections). Use it: /report t${id} <query>`, "ok", 9000);
  }
  savePrefs();
  renderTemplates();
}

function removeTemplate(id) {
  state.templates = state.templates.filter((t) => t.id !== id);
  savePrefs();
  renderTemplates();
  toast(`Removed template t${id}.`);
}

function renderTemplates() {
  const box = $("#templates");
  box.replaceChildren();
  if (!state.templates.length) {
    box.innerHTML = '<div class="empty">none — upload a sample report (.docx preferred)</div>';
    return;
  }
  for (const t of state.templates) {
    const row = document.createElement("div");
    row.className = "item";
    row.title = "Click to preview the section outline";
    row.innerHTML = `<span class="name"></span><button class="sm act danger" data-a="rm">✕</button>`;
    row.querySelector(".name").textContent = `t${t.id} · ${t.name}`;
    row.onclick = () => addSystemNote(
      `Template t${t.id} — ${t.name}\n\nSections:\n${t.outline.join("\n")}\n\nUse it: /report t${t.id} <query>`);
    row.querySelector('[data-a="rm"]').onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Remove template t${t.id} "${t.name}"?`)) removeTemplate(t.id);
    };
    box.append(row);
  }
}

/* ------------------------------------------------------------------- chat */

/**
 * Accumulates the turn's text blocks as they stream.
 *
 * The stream carries text as text-start / text-delta / text-end triples keyed by a
 * text id, and the agent opens a fresh block after each tool call. So a turn is a
 * *sequence* of blocks: the model's "Let me search the knowledge base…" preamble,
 * then the real answer. Only the last non-empty block is shown; the moment a new
 * block produces text it replaces what came before. This is the same rule
 * assistantAnswer() applies to a reloaded thread, because the backend persists one
 * text part per block.
 */
function textBlocks() {
  const blocks = [];
  const current = (id) => {
    const cur = blocks[blocks.length - 1];
    if (!cur || (id !== undefined && cur.id !== id)) blocks.push({ id, text: "" });
    return blocks[blocks.length - 1];
  };

  return {
    start: (id) => current(id),
    delta: (id, delta) => { current(id).text += delta; },
    // An empty block counts for nothing: text-start fires before the first token,
    // and treating it as the answer would blank the bubble until that token lands.
    answer: () => blocks.filter((b) => b.text.trim()).pop()?.text ?? "",
  };
}

/**
 * Run one chat turn.
 *
 * `opts` lets a slash command reuse the whole streaming/settle path without
 * duplicating it:
 *   opts.display  — text shown in the user bubble (default: `question`)
 *   opts.query    — the actual user_query sent to the backend (default: `question`)
 *   opts.onDone   — awaited after the answer settles
 */
async function ask(question, opts = {}) {
  if (state.busy) return;
  state.busy = true;
  $("#send").disabled = true;

  addMessage("user", opts.display ?? question);
  const { bubble, setStatus } = addMessage("assistant", "", true);

  const blocks = textBlocks();
  const paint = () => {
    bubble.innerHTML = renderMarkdown(blocks.answer());
    scrollDown();
  };

  try {
    const res = await api("POST", "/api/v1/new_chat", {
      json: {
        chat_id: state.threadId,
        search_space_id: state.spaceId,
        user_query: opts.query ?? question,
        // The server retrieves first and answers in one tool-free call. The
        // rules that used to be smuggled into user_query now live in the
        // backend's simple_rag system prompt.
        simple_rag: state.simpleRag,
      },
    });

    // The AI SDK stream protocol: `data: {json}` lines. The answer is the
    // concatenation of every text-delta; everything else is thinking steps, tool
    // calls and status. The stream also ends with a literal `data: [DONE]`.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).replace(/\r$/, "");
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;

        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;

        let ev;
        try { ev = JSON.parse(payload); } catch { continue; }

        if (ev.type === "text-start") {
          blocks.start(ev.id);
        } else if (ev.type === "text-delta" && typeof ev.delta === "string") {
          blocks.delta(ev.id, ev.delta);
          paint();
        } else if (!blocks.answer() && typeof ev.type === "string") {
          setStatus(describeEvent(ev));   // surfaces whether it actually searched
        }
      }
    }

    if (!blocks.answer()) {
      setStatus("The stream carried no answer. Usually: the model errored before " +
                "replying, or the chat role isn't wired to a working key.", "err");
    } else {
      setStatus(null);
      await settleAnswer(bubble, blocks.answer());
    }
    // A slash command's follow-up (e.g. /report locating the artifact the tool
    // wrote). Runs whether or not text streamed — generate_report can succeed
    // while the final narration block is empty. Its own errors surface via
    // setStatus, so it must not take down the turn.
    if (opts.onDone) {
      try { await opts.onDone({ setStatus }); }
      catch (e) { setStatus(e.message, "err"); }
    }
  } catch (e) {
    setStatus(e.message, "err");
  } finally {
    bubble.classList.remove("cursor");
    state.busy = false;
    $("#send").disabled = false;
    $("#q").focus();
    // The first reply in a thread gets auto-titled server-side; keep our name.
    guard(keepTitle);
  }
}

/**
 * Re-render the finished answer from the *persisted* message.
 *
 * The model cites with bare ordinals — [1], [2] — and the mapping from ordinal to
 * source lives in a server-side registry. The backend rewrites them into
 * [citation:<chunk id>] markers in assistant_finalize.py, which runs when the turn
 * is persisted, i.e. NOT on the live stream. So what streams to us has unclickable
 * [1]s in it, and only the stored copy has real citations. Swap it in once it lands.
 *
 * Persistence happens in the stream's `finally`, so it can trail the last byte we
 * read by a moment: retry once before giving up.
 */
async function settleAnswer(bubble, streamed) {
  // A citation bracket may hold one ordinal or several: [1], [1,2], [57-61].
  const ORDINALS = /\[\s*\d+(?:\s*[-–—,]\s*\d+)*\s*\]/;
  const hasOrdinals = ORDINALS.test(streamed);

  for (const wait of [0, 700]) {
    if (wait) await sleep(wait);

    const history = await apiJson("GET", `/api/v1/threads/${state.threadId}`);
    const last = (history?.messages ?? []).filter((m) => m.role === "assistant").pop();
    const stored = last ? assistantAnswer(last.content) : "";
    if (!stored.trim()) continue;

    // Only accept the stored copy once it is actually normalized — otherwise we
    // would repaint the same bare [1]s and pointlessly lose nothing but time.
    const settled = !hasOrdinals || stored.includes("[citation:") || !ORDINALS.test(stored);
    if (settled || wait) {
      bubble.innerHTML = renderMarkdown(stored);
      scrollDown();
      return;
    }
  }
}

/**
 * The backend auto-titles a thread from its first exchange (title_gen.py), which
 * would silently rename the session the user named. Put our name back. Unnamed
 * sessions (empty threadTitle) skip the pin — the auto-title is welcome there —
 * but still refresh the sidebar so it appears.
 */
async function keepTitle() {
  if (state.threadTitle) {
    const mine = (await listThreads()).find((t) => t.id === state.threadId);
    if (mine && mine.title !== state.threadTitle) {
      await api("PUT", `/api/v1/threads/${state.threadId}`, { json: { title: state.threadTitle } });
    }
  }
  await renderSessions();
}

/** Human-readable label for the pre-answer events, so a silent run is diagnosable. */
function describeEvent(ev) {
  const name = ev.toolName ?? ev.tool_name ?? "";
  if (ev.type.startsWith("tool")) {
    if (name.includes("search")) return "searching the knowledge base…";
    return name ? `calling ${name}…` : "calling a tool…";
  }
  if (ev.type.includes("thinking") || ev.type.includes("reasoning")) return "thinking…";
  if (ev.type === "task" || ev.type.includes("agent")) return "delegating to the knowledge_base agent…";
  return "working…";
}

/* ---------------------------------------------------------- chat commands */
//
// Slash commands typed into the composer. None of them go through the chat
// agent: /report and /revise POST to /reports/generate, which runs the same
// report pipeline the generate_report tool wraps; /export, /reports and
// /templates use the report CRUD/export routes. So every command works on
// whatever model the space is pinned to, including ones too small to drive the
// agent — the model only ever writes prose, never picks a tool.

const EXPORT_FORMATS = ["pdf", "docx", "html", "latex", "epub", "odt", "plain", "md"];

/** Parse "/cmd rest" and dispatch. Unknown commands toast rather than hit the model. */
async function runCommand(line) {
  const sp = line.indexOf(" ");
  const cmd = (sp === -1 ? line : line.slice(0, sp)).toLowerCase();
  const arg = sp === -1 ? "" : line.slice(sp + 1).trim();
  switch (cmd) {
    case "/report":    return reportCommand(arg);
    case "/revise":    return reviseCommand(arg);
    case "/export":    return exportCommand(arg);
    case "/reports":   return listReportsCommand();
    case "/templates": return listTemplatesCommand();
    case "/help":      return helpCommand();
    default:
      toast(`Unknown command ${cmd}. Try /help.`, "warn");
  }
}

/**
 * Build the `user_instructions` argument — the only field of the generate call
 * that reaches the report-writing prompt.
 *
 * This used to be a 4 KB directive telling the agent which subagent to delegate
 * to, which tool to call, and what to put in each of its six arguments. The
 * server now takes those arguments directly, so all that survives is the part
 * that was ever about the report itself: write in Vietnamese, and follow the
 * template when one is given.
 *
 * Vietnamese because the knowledge bases this deployment serves are Vietnamese
 * and reports must come out that way by default.
 */
function buildReportInstructions(request, tpl = null) {
  const base = "Viết báo cáo bằng tiếng Việt.";
  const ask = request.trim() ? `\n\nYêu cầu của người dùng:\n${request.trim()}` : "";
  if (!tpl) return base + ask;

  return `${base}

Báo cáo PHẢI theo đúng định dạng của báo cáo mẫu "${tpl.name}" dưới đây: giữ đúng
bố cục, thứ tự các phần và cách đặt tiêu đề; bắt chước văn phong, cách hành văn và
cách trình bày của trích đoạn mẫu. Chỉ thay nội dung cho phù hợp với chủ đề được
yêu cầu.

Bố cục các phần của báo cáo mẫu:
${tpl.outline.join("\n")}

Trích đoạn của báo cáo mẫu (để bắt chước văn phong và cách viết):
${tpl.content.slice(0, TPL_PROMPT_CHARS)}${ask}`;
}

/**
 * Pick the report_style the server expects. The agent used to infer this from
 * prose; it is a keyword match, so we do it here and skip the round trip.
 */
function reportStyleFor(request) {
  const q = request.toLowerCase();
  if (/\b(brief|ngắn|ngan|tóm tắt|tom tat|súc tích|suc tich)\b/.test(q)) return "brief";
  if (/\b(deep[\s_-]?research|nghiên cứu sâu|nghien cuu sau|chuyên sâu|chuyen sau)\b/.test(q))
    return "deep_research";
  return "detailed";
}

/** Every report belonging to the current thread, newest first. */
async function threadReports() {
  const all = await apiJson("GET", `/api/v1/reports?search_space_id=${state.spaceId}&limit=500`);
  return (all ?? []).filter((r) => r.thread_id === state.threadId)
                    .sort((a, b) => b.id - a.id);
}

/**
 * Write (or revise) a report via POST /reports/generate.
 *
 * No agent turn: the endpoint runs the same pipeline generate_report always
 * ran, and every argument it needs is already known here — the template block,
 * the style, the parent id. Only the KB search queries are model-derived, and
 * the server does that in one small call. The old path spent an entire agent
 * turn getting a model to guess arguments we had all along, and failed outright
 * on models that couldn't drive the two delegation hops.
 *
 * The request is a single blocking call rather than a stream: generation takes
 * a while and there is nothing to show mid-flight, so the assistant bubble just
 * carries a status line until the report id comes back.
 */
async function reportCommand(request, parentId = null) {
  if (!request) { toast("Usage: /report [t<id>] <what the report should cover>", "warn"); return; }
  if (state.busy) return;

  // "/report t2 <query>" formats the report after uploaded template t2. Only the
  // /report form takes a template — a revision keeps its parent's structure.
  let tpl = null;
  const m = parentId ? null : request.match(/^t(\d+)(?:\s+([\s\S]*))?$/i);
  if (m) {
    tpl = state.templates.find((t) => t.id === Number(m[1]));
    if (!tpl) { toast(`No template t${m[1]}. /templates lists what you have.`, "warn"); return; }
    request = (m[2] ?? "").trim();
    if (!request) { toast(`Usage: /report t${tpl.id} <what the report should cover>`, "warn"); return; }
  }

  state.busy = true;
  $("#send").disabled = true;

  addMessage("user",
    (parentId ? `/revise ${parentId} ` : `/report ${tpl ? `t${tpl.id} ` : ""}`) + request);
  const { bubble, setStatus } = addMessage("assistant", "", true);
  setStatus(parentId ? "Đang sửa lại báo cáo…" : "Đang tìm tư liệu và viết báo cáo…");

  try {
    const res = await apiJson("POST", "/api/v1/reports/generate", {
      json: {
        search_space_id: state.spaceId,
        thread_id: state.threadId,
        request,
        report_style: reportStyleFor(request),
        user_instructions: buildReportInstructions(request, tpl),
        parent_report_id: parentId,
      },
    });

    if (!res || res.status !== "ready" || !res.report_id) {
      setStatus(`Report failed: ${res?.error ?? "unknown error"}`, "warn");
      if (res?.report_id) {
        addSystemNote(`⚠ Report #${res.report_id} failed: ${res.error ?? "unknown error"}`);
      }
      return;
    }

    state.lastReportId = res.report_id;
    setStatus("");
    bubble.innerHTML = renderMarkdown(
      `Đã tạo báo cáo **“${res.title}”**${res.word_count ? ` (${res.word_count} từ)` : ""}.`);
    addSystemNote(
      `📄 Report #${res.report_id} — “${res.title}” is ready.\n` +
      `Download it:  /export ${res.report_id} pdf   (also: docx, html, latex, epub, odt, plain, md)\n` +
      `Revise it:    /revise ${res.report_id} <what to change>`);
  } catch (e) {
    setStatus(`Report failed: ${e.message}`, "warn");
  } finally {
    bubble.classList.remove("cursor");
    state.busy = false;
    $("#send").disabled = false;
    $("#q").focus();
  }
}

function reviseCommand(arg) {
  const parts = arg.split(/\s+/).filter(Boolean);
  let id = state.lastReportId;
  let instructions = arg;
  if (parts.length && /^\d+$/.test(parts[0])) {
    id = Number(parts[0]);
    instructions = parts.slice(1).join(" ");
  }
  if (!id) { toast("No report to revise. Run /report first, or /revise <report_id> <changes>.", "warn"); return; }
  if (!instructions.trim()) { toast("Usage: /revise [report_id] <what to change>", "warn"); return; }
  return reportCommand(instructions, id);
}

async function exportCommand(arg) {
  const parts = arg.split(/\s+/).filter(Boolean);
  let id, fmt;
  if (parts.length >= 2) { [id, fmt] = parts; }
  else if (parts.length === 1) {
    if (/^\d+$/.test(parts[0])) { id = parts[0]; fmt = "pdf"; }   // "/export 12" → pdf
    else { fmt = parts[0]; id = state.lastReportId; }            // "/export docx" → last report
  } else {
    fmt = "pdf"; id = state.lastReportId;
  }

  if (!id) { toast("No report to export. Run /report first, or /export <report_id> <format>.", "warn"); return; }
  fmt = (fmt || "pdf").toLowerCase();
  if (fmt === "markdown") fmt = "md";
  if (!EXPORT_FORMATS.includes(fmt)) {
    toast(`Unknown format "${fmt}". One of: ${EXPORT_FORMATS.join(", ")}.`, "warn");
    return;
  }
  await downloadReport(Number(id), fmt);
}

/** Map an export format to the extension our fallback filename uses. */
const EXT_FOR = { latex: "tex", plain: "txt", md: "md" };

/**
 * Download a report. `md` is the raw Markdown source (the /content route); every
 * other format is server-rendered by /export. The response is fetched with the
 * session cookie via api(), then handed to the browser as a blob — Content-
 * Disposition isn't readable cross-origin, so the filename is derived locally.
 */
async function downloadReport(id, fmt) {
  try {
    if (fmt === "md") {
      const c = await apiJson("GET", `/api/v1/reports/${id}/content`);
      const name = `${safeFilename(c?.title) || `report-${id}`}.md`;
      triggerDownload(new Blob([c?.content ?? ""], { type: "text/markdown;charset=utf-8" }), name);
    } else {
      const res = await api("GET", `/api/v1/reports/${id}/export?format=${fmt}`);
      const blob = await res.blob();
      triggerDownload(blob, `report-${id}.${EXT_FOR[fmt] ?? fmt}`);
    }
    toast(`Exported report #${id} as ${fmt}.`, "ok");
  } catch (e) {
    toast(`Export of report #${id} failed: ${e.message}`, "err", 10000);
  }
}

const safeFilename = (s) => (s ?? "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 80);

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function listReportsCommand() {
  const rs = await threadReports();
  if (!rs.length) { addSystemNote("No reports in this session yet. Create one with /report <query>."); return; }
  const lines = rs.map((r) =>
    `#${r.id} — ${r.title}${r.report_metadata?.status === "failed" ? "  (failed)" : ""}`);
  addSystemNote("Reports in this session:\n" + lines.join("\n") +
    "\n\nDownload: /export <id> <pdf|docx|html|latex|epub|odt|plain|md>");
}

async function listTemplatesCommand() {
  if (!state.templates.length) {
    addSystemNote("No report templates uploaded yet. Add one in the sidebar " +
      "(Report templates → + Add): a sample report as .docx (preferred), .pdf, .md or .txt, " +
      "with clear section headings.");
    return;
  }
  addSystemNote("Report templates:\n" +
    state.templates.map((t) => `t${t.id} — ${t.name} (${t.outline.length} sections)`).join("\n") +
    "\n\nUse one: /report t<id> <what the report should cover>");
}

function helpCommand() {
  addSystemNote([
    "Chat commands:",
    "  /report [t<id>] <query>  write a Markdown report from your knowledge base;",
    "                           t<id> formats it after an uploaded template",
    "  /revise [id] <changes>   revise a report (defaults to the last one made here)",
    "  /export [id] <format>    download a report — pdf, docx, html, latex, epub, odt, plain, md",
    "  /reports                 list the reports in this session",
    "  /templates               list your uploaded report templates",
    "  /help                    show this",
    "",
    "Anything without a leading / is asked against your knowledge base.",
    "",
    "Folders you upload are space-wide: every session can retrieve them. Tick",
    "\"this session only\" before adding one to keep it private to this session;",
    "⤴ in the Folders panel promotes such a folder back to space-wide.",
  ].join("\n"));
}

/* -------------------------------------------------------------- rendering */

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/**
 * The agent emits sources as [citation:<payload>], where the payload is either a
 * chunk id (shared/citations/markers.py) or a URL. Turn each into a numbered
 * chip: chunk ids open the source panel, URLs just link out.
 *
 * Returns a fresh replacer per render so numbering restarts at [1] for each
 * message and stays stable as the answer streams in.
 */
function citeChip() {
  const ordinals = new Map();
  return (_, payload) => {
    const key = payload.trim();
    if (!ordinals.has(key)) ordinals.set(key, ordinals.size + 1);
    const n = ordinals.get(key);

    // The text was HTML-escaped before this ran, so `key` is safe in an
    // attribute; it also means a URL's "&" arrives here as "&amp;".
    if (/^https?:/i.test(key.replace(/&amp;/g, "&"))) {
      return `<a class="cite" href="${key}" target="_blank" rel="noopener" title="${key}">${n}</a>`;
    }
    return `<a class="cite" data-cite="${key}" title="Show source ${n}">${n}</a>`;
  };
}

/**
 * Just enough Markdown for an LLM answer - no dependency, no CDN, no build.
 * Everything is HTML-escaped up front, so the tags below are the only ones that
 * can reach the DOM: a model that emits <script> gets it shown as text.
 */
function renderMarkdown(src) {
  // Fenced code is lifted out first and put back last, so the inline rules below
  // never mangle its contents.
  const fences = [];
  let text = escapeHtml(src).replace(/```\w*\n?([\s\S]*?)```/g, (_, code) => {
    fences.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`);
    return `\n\n@@FENCE${fences.length - 1}@@\n\n`;
  });

  text = text
    .replace(/\[citation:([^\]]+)\]/g, citeChip())
    // A model writing a range as two brackets — "[58]-[60]" — leaves its hyphen
    // between the resolved chips, which renders as chip-chip. The citations are
    // real; only the dash is noise. Drop it when it is tight against both (a
    // spaced " - " is more likely prose punctuation, so leave that alone).
    .replace(/(<\/a>)[-–—](?=<a class="cite")/g, "$1")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^\s*#{1,6}\s+(.+)$/gm, "<h4>$1</h4>")
    .replace(/^\s*(?:[-*+]|\d+\.)\s+(.+)$/gm, "<li>$1</li>")
    .replace(/(?:<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);

  text = text.split(/\n{2,}/).map((para) => {
    const p = para.trim();
    if (!p) return "";
    if (/^@@FENCE\d+@@$/.test(p) || /^<(ul|h4)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, "<br>")}</p>`;
  }).join("");

  return text.replace(/@@FENCE(\d+)@@/g, (_, i) => fences[+i]);
}
const scrollDown = () => { const m = $("#msgs"); m.scrollTop = m.scrollHeight; };

/* --------------------------------------------------------- citation panel */

function closeCitation() {
  $("#cite").classList.remove("on");
  document.querySelectorAll("a.cite.on").forEach((a) => a.classList.remove("on"));
}

/**
 * Resolve a cited chunk id to the document it came from, and show the passage in
 * context — a window of chunks either side, with the cited one highlighted.
 */
async function openCitation(chunkId, chip) {
  document.querySelectorAll("a.cite.on").forEach((a) => a.classList.remove("on"));
  chip?.classList.add("on");

  const panel = $("#cite"), title = $("#citeTitle"), body = $("#citeBody");
  panel.classList.add("on");
  title.textContent = `Source ${chip?.textContent ?? ""}`;
  body.textContent = "Loading…";

  try {
    const doc = await apiJson("GET", `/api/v1/documents/by-chunk/${chunkId}?chunk_window=3`);
    title.textContent = doc.title || `Document #${doc.id}`;

    body.replaceChildren();
    for (const chunk of doc.chunks ?? []) {
      const div = document.createElement("div");
      div.className = "chunk" + (chunk.id === Number(chunkId) ? " hit" : "");
      div.textContent = chunk.content;
      body.append(div);
    }
    body.querySelector(".hit")?.scrollIntoView({ block: "center" });
  } catch (e) {
    body.textContent = e.status === 404
      ? `That passage is gone — chunk ${chunkId} no longer exists (the document was probably re-indexed or deleted).`
      : `Could not load the source: ${e.message}`;
  }
}

function addMessage(role, text, streaming = false) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "You" : state.model;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (streaming ? " cursor" : "");
  if (role === "user") bubble.textContent = text;
  else bubble.innerHTML = renderMarkdown(text);

  const status = document.createElement("div");
  status.className = "status";

  wrap.append(who, bubble, status);
  $("#msgs").append(wrap);
  scrollDown();

  const setStatus = (msg, kind = "") => {
    status.textContent = msg ?? "";
    status.className = `status ${kind}`;
  };
  return { bubble, setStatus };
}

/**
 * A client-side note in the message flow — command output like "report ready" or
 * /help. Not sent to the model and not persisted; /reports re-derives report state
 * from the server, so a reload dropping these notes loses nothing.
 */
function addSystemNote(text) {
  const wrap = document.createElement("div");
  wrap.className = "msg system";
  const bubble = document.createElement("div");
  bubble.className = "bubble sys";
  bubble.textContent = text;
  wrap.append(bubble);
  $("#msgs").append(wrap);
  scrollDown();
}

async function renderSessions() {
  const box = $("#sessions");
  const threads = await listThreads();
  box.replaceChildren();
  if (!threads.length) { box.innerHTML = '<div class="empty">no sessions yet</div>'; return; }

  for (const t of threads) {
    const row = document.createElement("div");
    row.className = "item" + (t.id === state.threadId ? " active" : "");
    row.innerHTML = `<span class="name"></span><button class="sm act danger" data-a="rm">✕</button>`;
    row.querySelector(".name").textContent = t.title;
    row.onclick = () => t.id !== state.threadId && guard(() => openThread(t));
    row.querySelector('[data-a="rm"]').onclick = (e) => {
      e.stopPropagation();                       // don't switch to the thread we're deleting
      if (confirm(`Delete session "${t.title}" and all of its messages?`)) {
        guard(() => deleteSession(t));
      }
    };
    box.append(row);
  }
}

/**
 * Deleting the session you're in leaves nowhere to be, so land somewhere sane:
 * the newest surviving thread, or a fresh one if that was the last.
 */
async function deleteSession(thread) {
  await api("DELETE", `/api/v1/threads/${thread.id}`);
  toast(`Deleted session "${thread.title}".`);

  if (thread.id === state.threadId) state.threadId = null;
  await resumeSession();
}

async function promoteFolder(f) {
  await api("PATCH", `/api/v1/folders/${f.id}/scope`, { json: { scope: "space" } });
  toast(`"${f.name}" is now space-wide — every session sees it.`, "ok", 8000);
  await renderFolders();
}

async function renderFolders() {
  const box = $("#folders");
  const folders = await watchedFolders() ?? [];
  box.replaceChildren();
  if (!folders.length) { box.innerHTML = '<div class="empty">no folders indexed</div>'; return; }

  for (const f of folders) {
    const scoped = f.owner_thread_id != null;
    const mine = scoped && f.owner_thread_id === state.threadId;
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span class="name"></span>
      <span class="badge scope hide"></span>
      <button class="sm act hide" data-a="promote"
        title="Make this folder space-wide: every chat session will see it.">⤴</button>
      <button class="sm act" data-a="share">Share</button>
      <button class="sm act danger" data-a="rm">✕</button>`;
    row.querySelector(".name").textContent = f.name;
    // A session-scoped folder answers only inside its own session; label whose
    // it is so two same-named rows are tellable apart.
    const badge = row.querySelector(".scope");
    if (scoped) {
      badge.textContent = mine ? "this session" : `session #${f.owner_thread_id}`;
      badge.classList.remove("hide");
      row.querySelector('[data-a="promote"]').classList.remove("hide");
      row.querySelector('[data-a="promote"]').onclick = () => {
        if (confirm(`Make "${f.name}" space-wide? Every chat session will then see and search it. This cannot be scoped back.`)) {
          guard(() => promoteFolder(f));
        }
      };
    }
    // The backend refuses to share a session-scoped folder (promote first), so
    // don't offer a button that can only 400.
    if (scoped) row.querySelector('[data-a="share"]').classList.add("hide");
    else row.querySelector('[data-a="share"]').onclick = () => guard(() => shareFolder(f.name));
    row.querySelector('[data-a="rm"]').onclick = () => {
      if (confirm(`Remove "${f.name}" and all of its documents?`)) {
        guard(async () => { await deleteFolder(f.id); toast(`Removed "${f.name}".`); await renderFolders(); });
      }
    };
    box.append(row);
  }
}

async function renderImports() {
  const box = $("#imports");
  const links = await listImports() ?? [];
  box.replaceChildren();
  if (!links.length) { box.innerHTML = '<div class="empty">nothing imported</div>'; return; }

  for (const link of links) {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span class="name"></span>
      <span class="dead hide" title="The owner revoked or expired this share, so it no longer answers questions.">revoked</span>
      <button class="sm act danger" data-a="rm">✕</button>`;
    row.querySelector(".name").textContent = link.folder_name;
    // A revoked share leaves the link in place but stops resolving: say so rather
    // than let it look searchable.
    row.querySelector(".dead").classList.toggle("hide", link.live !== false);
    row.querySelector('[data-a="rm"]').onclick = () => {
      if (confirm(`Remove the imported folder "${link.folder_name}"?\n\nOnly your link is removed — the owner's documents are untouched, and the same token can import it again.`)) {
        guard(() => removeImport(link));
      }
    };
    box.append(row);
  }
}

function renderShares() {
  const box = $("#shares");
  box.replaceChildren();
  if (!state.shares.length) { box.innerHTML = '<div class="empty">nothing shared</div>'; return; }

  for (const s of state.shares) {
    const row = document.createElement("div");
    row.innerHTML = `<div class="item" style="cursor:default">
        <span class="name mono"></span>
        <button class="sm" data-a="copy">Copy</button>
        <button class="sm danger" data-a="rm">Revoke</button>
      </div>
      <div class="token mono"></div>`;
    row.querySelector(".name").textContent = s.path;
    row.querySelector(".token").textContent = s.token;
    row.querySelector('[data-a="copy"]').onclick = () =>
      navigator.clipboard.writeText(s.token).then(() => toast("Token copied."));
    row.querySelector('[data-a="rm"]').onclick = () => guard(() => unshareFolder(s.token));
    box.append(row);
  }
}

function renderContext() {
  $("#ctx").textContent = `space #${state.spaceId} · thread #${state.threadId}`;
  $("#whoami").textContent = `${state.email}\ncli:${state.email}`;
}

/* ------------------------------------------------------------------- admin */
//
// Shown only to system admins (is_superuser). Every action is also enforced
// server-side by require_admin, so a non-admin who forced the panel open would
// just get 403s — the client gate is only about not showing dead buttons.

const adminApi = (method, path, opts) => apiJson(method, `/api/v1/admin${path}`, opts);

/** Read is_superuser off /users/me and reveal the Admin button if set. */
async function detectAdmin() {
  try {
    const me = await apiJson("GET", "/users/me");
    state.isAdmin = !!me?.is_superuser;
  } catch { state.isAdmin = false; }
  $("#adminBtn").classList.toggle("hide", !state.isAdmin);
}

async function openAdmin() {
  $("#admin").classList.remove("hide");
  await refreshAdmin();
}
const closeAdmin = () => $("#admin").classList.add("hide");

async function refreshAdmin() {
  await Promise.all([renderAdminUsers(), renderAdminShares(), renderAdminLinks()]);
}

function makeBtn(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = `sm ${cls}`;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

async function renderAdminUsers() {
  const box = $("#adminUsers");
  box.textContent = "Loading…";
  const users = await adminApi("GET", "/users");
  box.replaceChildren();

  for (const u of users) {
    const row = document.createElement("div");
    row.className = "arow";

    const info = document.createElement("div");
    info.className = "grow";
    info.innerHTML = `<span></span>
      <div class="sub">${u.search_space_count} space(s)</div>`;
    info.querySelector("span").textContent = u.email;
    if (u.is_superuser) info.querySelector("span").after(tagged(" admin", "admin"));
    if (!u.is_active) info.querySelector("span").after(tagged(" inactive", "off"));
    row.append(info);

    row.append(makeBtn(u.is_superuser ? "Remove admin" : "Make admin", "", () =>
      guard(async () => {
        await adminApi("PATCH", `/users/${u.id}`, { json: { is_superuser: !u.is_superuser } });
        await renderAdminUsers();
      })));
    row.append(makeBtn(u.is_active ? "Deactivate" : "Activate", "", () =>
      guard(async () => {
        await adminApi("PATCH", `/users/${u.id}`, { json: { is_active: !u.is_active } });
        await renderAdminUsers();
      })));

    const foldersBox = document.createElement("div");
    foldersBox.className = "afolders hide";
    row.append(makeBtn("Folders", "", () =>
      guard(() => toggleUserFolders(u, foldersBox))));

    row.append(makeBtn("Delete", "danger", () => {
      if (confirm(`Delete user ${u.email} and ALL their data (spaces, folders, documents, chats)?\n\nThis cannot be undone.`)) {
        guard(async () => {
          await adminApi("DELETE", `/users/${u.id}`);
          toast(`Deleted ${u.email}.`);
          await refreshAdmin();
        });
      }
    }));

    box.append(row, foldersBox);
  }
  if (!users.length) box.innerHTML = '<div class="empty">no users</div>';
}

const tagged = (text, cls) => {
  const s = document.createElement("span");
  s.className = `badge ${cls}`;
  s.textContent = text.trim();
  s.style.marginLeft = "6px";
  return s;
};

async function toggleUserFolders(user, box) {
  if (!box.classList.contains("hide")) { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  box.textContent = "Loading…";
  const folders = await adminApi("GET", `/users/${user.id}/folders`);
  box.replaceChildren();
  if (!folders.length) { box.innerHTML = '<div class="empty">no folders</div>'; return; }
  for (const f of folders) {
    const r = document.createElement("div");
    r.className = "arow";
    const g = document.createElement("div");
    g.className = "grow";
    g.innerHTML = `<span></span> <span class="sub">in ${f.search_space_name ?? `space #${f.search_space_id}`}</span>`;
    g.querySelector("span").textContent = f.name;
    if (f.owner_thread_id != null) g.querySelector("span").after(tagged(` session #${f.owner_thread_id}`, "off"));
    r.append(g);
    if (f.owner_thread_id != null) {
      r.append(makeBtn("Promote", "", () => {
        if (confirm(`Make "${f.name}" (of ${user.email}) space-wide? All of their sessions will see it.`)) {
          guard(async () => {
            await adminApi("PATCH", `/folders/${f.id}/scope`);
            toast(`"${f.name}" is now space-wide.`);
