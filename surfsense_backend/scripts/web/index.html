            box.classList.add("hide");
            await toggleUserFolders(user, box);  // re-expand with fresh data
          });
        }
      }));
    }
    r.append(makeBtn("Delete", "danger", () => {
      if (confirm(`Delete folder "${f.name}" (of ${user.email}) and its documents?`)) {
        guard(async () => {
          await adminApi("DELETE", `/folders/${f.id}`);
          toast(`Deleting "${f.name}" (documents are queued for removal).`);
          await toggleUserFolders(user, box);  // collapse
        });
      }
    }));
    box.append(r);
  }
}

async function renderAdminShares() {
  const box = $("#adminShares");
  box.textContent = "Loading…";
  const shares = await adminApi("GET", "/folder-shares");
  box.replaceChildren();
  if (!shares.length) { box.innerHTML = '<div class="empty">no shares</div>'; return; }

  for (const s of shares) {
    const row = document.createElement("div");
    row.className = "arow";
    const g = document.createElement("div");
    g.className = "grow";
    g.innerHTML = `<span></span>
      <div class="sub">by ${s.created_by_email ?? "—"} · ${s.link_count} importer(s) · ` +
      `${s.uses_count} use(s)</div>`;
    g.querySelector("span").textContent = s.name ?? `folder #${s.source_folder_id}`;
    if (s.revoked_at) g.querySelector("span").after(tagged(" revoked", "dead"));
    row.append(g);
    row.append(makeBtn("Hard-revoke", "danger", () => {
      if (confirm(`Hard-revoke "${s.name ?? s.source_folder_id}"?\n\nIt is removed from all ${s.link_count} importer(s)' knowledge bases immediately.`)) {
        guard(async () => {
          const r = await adminApi("DELETE", `/folder-shares/${s.id}`);
          toast(`Revoked — removed from ${r?.links_removed ?? 0} knowledge base(s).`);
          await refreshAdmin();
        });
      }
    }));
    box.append(row);
  }
}

async function renderAdminLinks() {
  const box = $("#adminLinks");
  box.textContent = "Loading…";
  const links = await adminApi("GET", "/folder-links");
  box.replaceChildren();
  if (!links.length) { box.innerHTML = '<div class="empty">nothing imported</div>'; return; }

  for (const l of links) {
    const row = document.createElement("div");
    row.className = "arow";
    const g = document.createElement("div");
    g.className = "grow";
    g.innerHTML = `<span></span> <span class="sub">→ ${l.target_owner_email ?? `space #${l.target_search_space_id}`}</span>`;
    g.querySelector("span").textContent = l.source_folder_name ?? `folder #${l.source_folder_id}`;
    row.append(g);
    row.append(makeBtn("Remove", "danger", () => {
      if (confirm(`Remove this imported folder from ${l.target_owner_email ?? "that user"}'s knowledge base?\n\nThe owner's folder is untouched.`)) {
        guard(async () => {
          await adminApi("DELETE", `/folder-links/${l.id}`);
          toast("Import removed.");
          await refreshAdmin();
        });
      }
    }));
    box.append(row);
  }
}

/* ------------------------------------------------------------------ wiring */

/** Runs an async handler, turning any ApiError into a toast instead of a dead UI. */
async function guard(fn) {
  try { await fn(); }
  catch (e) { toast(e.message, "err", 10000); }
}

function showApp() {
  $("#auth").classList.add("hide");
  $("#app").classList.add("on");
  $("#q").focus();
}

async function start() {
  await ensureSpace();
  await ensureModel();
  await resumeSession();
  await renderFolders();
  await renderImports();
  renderShares();
  renderTemplates();
  renderContext();
  await detectAdmin();
  showApp();
}

async function doAuth(mode) {
  const email = $("#email").value.trim();
  const password = $("#password").value;
  const apiKey = INJECTED_KEY || $("#apiKey").value.trim();

  if (!email || !password) { $("#authMsg").textContent = "Email and password are required."; return; }
  if (!apiKey) { $("#authMsg").textContent = "The API key is required — it wires the chat model to your user."; return; }

  // Whoever signed in last may not be who is signing in now: take only this
  // user's shares and session, never the previous account's.
  if (email !== state.email) adoptUser(email);

  Object.assign(state, {
    email, password, apiKey,
    backend: ($("#backend").value.trim() || "http://localhost:8000").replace(/\/$/, ""),
    model: INJECTED_MODEL || $("#model").value.trim() || "deepseek-chat",
    modelBase: INJECTED_BASE || $("#modelBase").value.trim() || "https://api.deepseek.com/v1",
  });
  savePrefs();

  const btns = [$("#loginBtn"), $("#registerBtn")];
  btns.forEach((b) => (b.disabled = true));
  $("#authMsg").textContent = mode === "register" ? "Registering…" : "Signing in…";

  try {
    if (mode === "register") {
      const r = await register(email, password);
      $("#authMsg").textContent = r === "exists" ? "Already registered — signing in…" : "Registered. Signing in…";
    }
    await login(email, password);
    $("#authMsg").textContent = "Setting up your knowledge base…";
    await start();
  } catch (e) {
    $("#authMsg").textContent = `Error: ${e.message}`;
  } finally {
    btns.forEach((b) => (b.disabled = false));
  }
}

function init() {
  loadPrefs();
  $("#backend").value = state.backend;
  $("#email").value = state.email;
  $("#apiKey").value = state.apiKey;
  $("#model").value = state.model;
  $("#modelBase").value = state.modelBase;
  $("#simpleRag").checked = state.simpleRag;

  // Whatever came from the server, don't ask for (and don't let it be edited).
  if (INJECTED_KEY) $("#apiKeyRow").classList.add("hide");
  if (INJECTED_MODEL) { $("#model").value = INJECTED_MODEL; $("#model").disabled = true; }
  if (INJECTED_BASE) { $("#modelBase").value = INJECTED_BASE; $("#modelBase").disabled = true; }

  // Origin is the whole ballgame: the backend's CSRF middleware only accepts an
  // allow-listed one, and file:// sends "null". Fail loudly rather than let every
  // write 403 with no explanation.
  if (location.protocol === "file:") {
    const w = $("#originWarn");
    w.classList.remove("hide");
    w.textContent = "Opened as a file:// page, so the browser sends \"Origin: null\" and every " +
      "write will fail the backend's CSRF check.\n\nServe it instead:\n" +
      "  python -m http.server 3000 --directory surfsense_backend/scripts/web\n\n" +
      "then open http://localhost:3000.";
  } else if (location.port !== "3000") {
    const w = $("#originWarn");
    w.classList.remove("hide");
    w.className = "toast warn";
    w.textContent = `Served from port ${location.port || "80"}. The backend only trusts ` +
      `http://localhost:3000 for cookie-authenticated writes (CSRF_ALLOWED_ORIGINS / ` +
      `NEXT_FRONTEND_URL), so uploads and questions may fail with 403. Serve on :3000, or ` +
      `add this origin to CSRF_ALLOWED_ORIGINS.`;
  }

  $("#loginBtn").onclick = () => doAuth("login");
  $("#registerBtn").onclick = () => doAuth("register");
  for (const id of ["#email", "#password", "#apiKey"]) {
    $(id).addEventListener("keydown", (e) => e.key === "Enter" && doAuth("login"));
  }

  $("#signOut").onclick = () => { state.password = ""; location.reload(); };

  $("#adminBtn").onclick = () => guard(openAdmin);
  $("#adminClose").onclick = closeAdmin;
  $("#adminRefresh").onclick = () => guard(refreshAdmin);

  $("#newSessionBtn").onclick = () => {
    const title = $("#newSession").value.trim();
    $("#newSession").value = "";
    guard(() => createSession(title));
  };
  $("#newSession").addEventListener("keydown", (e) => e.key === "Enter" && $("#newSessionBtn").click());

  $("#addFolderBtn").onclick = () => $("#folderPicker").click();
  $("#folderPicker").onchange = (e) => onFolderPicked(e.target);

  $("#addTplBtn").onclick = () => $("#tplPicker").click();
  $("#tplPicker").onchange = (e) => {
    // Same live-FileList trap as the folder picker: copy before clearing.
    const files = Array.from(e.target.files);
    e.target.value = "";
    if (files.length) guard(() => addTemplates(files));
  };

  $("#importBtn").onclick = () => {
    const token = $("#importToken").value.trim();
    if (!token) return;
    $("#importToken").value = "";
    guard(() => importFolder(token));
  };
  $("#importToken").addEventListener("keydown", (e) => e.key === "Enter" && $("#importBtn").click());

  $("#simpleRag").onchange = (e) => { state.simpleRag = e.target.checked; savePrefs(); };

  // Citation chips are re-created on every repaint of a streaming answer, so the
  // listener lives on the container instead of the chips.
  $("#msgs").addEventListener("click", (e) => {
    const chip = e.target.closest("a.cite[data-cite]");
    if (!chip) return;
    e.preventDefault();
    guard(() => openCitation(chip.dataset.cite, chip));
  });
  $("#citeClose").onclick = closeCitation;
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#admin").classList.contains("hide")) closeAdmin();
    else closeCitation();
  });

  const q = $("#q");
  const submit = () => {
    const text = q.value.trim();
    if (!text || state.busy) return;
    q.value = "";
    q.style.height = "auto";
    // A leading slash is a command (/report, /export, …); everything else is a question.
    guard(() => (text[0] === "/" ? runCommand(text) : ask(text)));
  };
  $("#send").onclick = submit;
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  q.addEventListener("input", () => {
    q.style.height = "auto";
    q.style.height = `${Math.min(q.scrollHeight, 180)}px`;
  });
}

init();
</script>
